<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Nature Finder Map Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="sidebar">
        <h3>Tiles</h3>
        <div id="palette"></div>
        <hr>
        <button onclick="exportMap()">Export</button>
        <textarea id="export-area" readonly></textarea>
        <p style="color: rgb(255, 0, 0);">Note: Tiles with names in red have collision enabled !</p>
        <p style="color: rgb(0, 255, 0);">Note: It is highly recommended to prevent the player from changing map when on a peripheral map by placing collision tiles.</p>
    </div>

    <div id="editor">
        <div id="grid"></div>
    </div>

    <script>

        let tileConfig = [];
        let selectedTileId = null;
        const ROWS = 14;
        const COLS = 24;


        async function loadTiles() {
            try {
                const response = await fetch('../tiles.json');
                tileConfig = await response.json();
                initEditor();
            } catch (error) {
                console.error("Error when loading JSON :", error);
                alert("Unable to load tiles.json");
            }
        }

        function initEditor() {
            const palette = document.getElementById('palette');
            tileConfig.forEach(tile => {
                const div = document.createElement('div');
                div.className = `tile-select ${tile.id === 'W' ? 'selected' : ''}`;
                div.innerHTML = `<div class="preview-img" style="background-image:url('${tile.sprite}')"></div> <span style="color:${tile.hasCollision ? "red" : "white"}">${tile.name} (${tile.id})</span>`;
                div.onclick = () => {
                    document.querySelectorAll('.tile-select').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedTileId = tile.id;
                };
                palette.appendChild(div);
            });


            const grid = document.getElementById('grid');
            const defaultTile = tileConfig[0];

            for (let i = 0; i < ROWS * COLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.id = defaultTile.id;
                if (defaultTile) cell.style.backgroundImage = `url('${defaultTile.sprite}')`;

                cell.onmousedown = () => paint(cell);
                cell.onmouseover = (e) => { if (e.buttons === 1) paint(cell); };
                grid.appendChild(cell);
            }
        }


        function paint(cell) {
            const tile = tileConfig.find(t => t.id === selectedTileId);
            if (tile) {
                cell.dataset.id = tile.id;
                cell.style.backgroundImage = `url('${tile.sprite}')`;
            }
        }


        function exportMap() {
            const cells = document.querySelectorAll('.cell');
            let lines = [];
            for (let r = 0; r < ROWS; r++) {
                let row = "";
                for (let c = 0; c < COLS; c++) {
                    row += cells[r * COLS + c].dataset.id;
                }
                lines.push(`"${row}"`);
            }
            document.getElementById('export-area').value = lines.join(",\n");
        }

        // Load tiles on page loading
        loadTiles();
    </script>

</body>

</html>
