<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Nature Finder Map Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="sidebar">
    <h3>Tiles</h3>
    <div id="palette"></div>
    <hr>
    <button onclick="exportMap()">Exporter</button>
    <textarea id="export-area" readonly></textarea>
</div>

<div id="editor">
    <div id="grid"></div>
</div>

<script>
    
    let tileConfig = [];
    let selectedTileId = "W";
    const ROWS = 14;
    const COLS = 24;

    // 1. Charger le fichier JSON externe
    async function loadTiles() {
        try {
            const response = await fetch('../tiles.json');
            tileConfig = await response.json();
            initEditor();
        } catch (error) {
            console.error("Erreur lors du chargement du JSON :", error);
            alert("Impossible de charger tiles.json. Assurez-vous d'utiliser un serveur local (Live Server).");
        }
    }

    function initEditor() {
        // 2. Initialisation Palette
        const palette = document.getElementById('palette');
        tileConfig.forEach(tile => {
            const div = document.createElement('div');
            div.className = `tile-select ${tile.id === 'W' ? 'selected' : ''}`;
            div.innerHTML = `<div class="preview-img" style="background-image:url('${tile.sprite}')"></div> <span style="color:${tile.hasCollision ? "red" : "white"}">${tile.name}</span>`;
            div.onclick = () => {
                document.querySelectorAll('.tile-select').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                selectedTileId = tile.id;
            };
            palette.appendChild(div);
        });

        // 3. Initialisation Grille (Map par défaut : Eau "W")
        const grid = document.getElementById('grid');
        const waterTile = tileConfig.find(t => t.id === 'W');
        
        for (let i = 0; i < ROWS * COLS; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.id = "W";
            if (waterTile) cell.style.backgroundImage = `url('${waterTile.sprite}')`;
            
            cell.onmousedown = () => paint(cell);
            cell.onmouseover = (e) => { if(e.buttons === 1) paint(cell); };
            grid.appendChild(cell);
        }
    }

    function paint(cell) {
        const tile = tileConfig.find(t => t.id === selectedTileId);
        if (tile) {
            cell.dataset.id = tile.id;
            cell.style.backgroundImage = `url('${tile.sprite}')`;
        }
    }

    function exportMap() {
        const cells = document.querySelectorAll('.cell');
        let lines = [];
        for (let r = 0; r < ROWS; r++) {
            let row = "";
            for (let c = 0; c < COLS; c++) {
                row += cells[r * COLS + c].dataset.id;
            }
            lines.push(`"${row}"`);
        }
        document.getElementById('export-area').value = lines.join(",\n");
    }

    // Lancement au chargement de la page
    loadTiles();
</script>

</body>
</html>
